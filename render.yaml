services:
  - type: web
    name: easynotes
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: "15"
      - key: PAYSTACK_FEE_BEARER
        value: account
      - key: MAX_DOWNLOADS
        value: "10"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: UMAMI_WEBSITE_ID
        sync: false
